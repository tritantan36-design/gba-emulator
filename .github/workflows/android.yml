name: Phase 0-7A ordinary QA
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      device_tests:
        description: Run on a configured self-hosted ARM64 Android device runner
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install frozen Temurin 21.0.12.1+1
        shell: bash
        run: |
          set -euo pipefail
          jdk_archive="$RUNNER_TEMP/temurin-21.0.12.1+1.tar.gz"
          jdk_dir="$RUNNER_TEMP/temurin-21.0.12.1+1"
          curl --fail --location --retry 3 --output "$jdk_archive" 'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12.1%2B1/OpenJDK21U-jdk_x64_linux_hotspot_21.0.12.1_1.tar.gz'
          echo "ce79869e1307ed8ee1e2baa86a412b1eb5b75d10a01006d788a6f968bcfaee94  $jdk_archive" | sha256sum --check
          mkdir -p "$jdk_dir"
          tar -xzf "$jdk_archive" --strip-components=1 -C "$jdk_dir"
          grep -Fx 'JAVA_RUNTIME_VERSION="21.0.12.1+1-LTS"' "$jdk_dir/release"
          "$jdk_dir/bin/java" -version
          echo "JAVA_HOME=$jdk_dir" >> "$GITHUB_ENV"
          echo "$jdk_dir/bin" >> "$GITHUB_PATH"
      - name: Install pinned Android tools
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="$RUNNER_TEMP/android-sdk"
          tools_archive="$RUNNER_TEMP/android-cmdline-tools-19.zip"
          curl --fail --location --retry 3 --output "$tools_archive" 'https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip'
          echo "5fdcc763663eefb86a5b8879697aa6088b041e70  $tools_archive" | sha1sum --check
          mkdir -p "$sdk_dir/cmdline-tools"
          unzip -q "$tools_archive" -d "$sdk_dir/cmdline-tools"
          mv "$sdk_dir/cmdline-tools/cmdline-tools" "$sdk_dir/cmdline-tools/19.0"
          grep -Fx 'Pkg.Revision=19.0' "$sdk_dir/cmdline-tools/19.0/source.properties"
          sdkmanager="$sdk_dir/cmdline-tools/19.0/bin/sdkmanager"
          "$sdkmanager" --sdk_root="$sdk_dir" --licenses < <(printf 'y\n%.0s' {1..100}) > "$RUNNER_TEMP/android-sdk-licenses.log"
          "$sdkmanager" --sdk_root="$sdk_dir" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
          echo "ANDROID_HOME=$sdk_dir" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_dir" >> "$GITHUB_ENV"
          echo "$sdk_dir/cmake/3.22.1/bin" >> "$GITHUB_PATH"
      - name: Build, unit tests, lint, CMake arm64, JNI test compilation, unsigned release
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease test lint :app:assembleDebugAndroidTest :core-mgba:assembleDebugAndroidTest :app:exportRuntimeDependencies -Pphase7a=true --console=plain
      - name: Native PCM queue and source-built mGBA smoke tests
        run: |
          cmake -S audio/src/test/cpp -B audio/build/native-tests -G Ninja
          cmake --build audio/build/native-tests
          ctest --test-dir audio/build/native-tests --output-on-failure
          cmake -S core-mgba/src/test/cpp -B core-mgba/build/host-tests -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build core-mgba/build/host-tests --parallel 4
          ctest --test-dir core-mgba/build/host-tests --output-on-failure
      - name: Permission, dependency, license and source audit
        run: python3 scripts/audit.py --phase7a
      - name: Export ordinary QA results and unsigned candidates
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase7-ordinary-qa-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            **/build/test-results/**/TEST-*.xml
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml
            app/build/reports/runtime-dependencies.txt
            audio/build/native-tests/Testing/Temporary/LastTest.log
            core-mgba/build/host-tests/Testing/Temporary/LastTest.log
            docs/reports/PHASE_7A_APK_PROVENANCE_AUDIT.md
  device:
    if: github.event_name == 'workflow_dispatch' && inputs.device_tests
    runs-on: [self-hosted, android-arm64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: JNI and Activity tests on arm64 device
        run: ./gradlew :core-mgba:connectedDebugAndroidTest :app:connectedDebugAndroidTest --console=plain
